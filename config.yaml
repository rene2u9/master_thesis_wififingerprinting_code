data:
  db_path: "data/wifi_fingerprints.db"
  batch_size: 32
  num_workers: 4
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  random_seed: 42
  max_samples: 40000                     # same subset via random_seed
  missing_value: -100                    # dBm for undetected APs
  rssi_normalization: "minmax"           # "minmax" | "legacy"
  rssi_min: -90                          # dBm, mapped to 0
  rssi_max: -50                          # dBm, mapped to 1
  storage_place_filter: "GRO-4%"        # aisles GRO-40..GRO-49
  deduplicate: true                      # needs fingerprint_hash table (scripts/deduplicate_fingerprints.py)
  filter_ssid_prefix: null
  max_aps: 256                           # 208 physical APs, padded to 16x16
  image_shape: [16, 16, 1]
  target_scale: [228.0, 336.0]          # metres, [lat, lon] range

training:
  max_epochs: 200
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adam"
  scheduler: "reduce_on_plateau"         # reduce_on_plateau | cosine_warmup | constant
  warmup_epochs: 5                       # cosine_warmup only
  early_stopping_patience: 30            # must exceed warmup_epochs
  gradient_clip_val: 1.0
  dropout: 0.5
  noise_coefficient: 0.0                 # train only, not used by SAE pretraining
  save_top_k: 3
  checkpoint_metric: "val_mpe"           # metres
  checkpoint_mode: "min"

metrics:
  compute: ["mpe", "cdf", "positioning_accuracy", "inference_time"]
  cdf_thresholds: [1.0, 2.0, 5.0, 10.0, 15.0, 20.0, 25.0, 30.0, 40.0, 50.0]
  accuracy_tolerance: 20.0               # metres

logging:
  experiment_name: "wifi_fingerprinting"
  tensorboard_dir: "experiments/tensorboard"
  save_predictions: true
  log_every_n_steps: 50

hardware:
  accelerator: "auto"
  devices: 1
  precision: 32
  deterministic: true

ablation:
  dataset_sizes: [0.1, 0.25, 0.5, 0.75, 1.0]
  temporal_splits:
    enabled: true
    train_date_range: ["2025-11-11", "2026-02-01"]
    test_date_range: ["2026-02-01", "2026-03-12"]
  denoising_variants:
    - { name: "no_noise",     noise_coefficient: 0.0 }
    - { name: "light_noise",  noise_coefficient: 0.15 }
    - { name: "medium_noise", noise_coefficient: 0.3 }
    - { name: "heavy_noise",  noise_coefficient: 0.5 }

# spatial_image_mode: unset (sequential) | naive | oa | upscale | bilinear | gaussian | warehouse
# graph_topology: covisible | bipartite
# per-model image_shape overrides data.image_shape, gaussian needs >= 64x64

runs:

  dscnn_sequential:
    model: dscnn
    dropout: 0.5
    noise_coefficient: 0.0
    image_shape: [16, 16, 1]

  dscnn_spatial_naive:
    model: dscnn
    dropout: 0.5
    noise_coefficient: 0.0
    spatial_image_mode: "naive"          # max-RSSI wins on pixel collisions
    image_shape: [16, 16, 1]

  dscnn_spatial_oa:
    model: dscnn
    dropout: 0.5
    noise_coefficient: 0.0
    spatial_image_mode: "oa"
    image_shape: [16, 16, 1]

  dscnn_gaussian:
    model: dscnn
    dropout: 0.5
    noise_coefficient: 0.0
    spatial_image_mode: "gaussian"
    image_shape: [64, 64, 1]

  efficientnet:
    model: efficientnet
    variant: "b0"
    pretrained: true
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [64, 64, 1]

  efficientnet_v2:
    model: efficientnet
    variant: "v2_s"
    pretrained: true                     # ImageNet-1K weights
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [384, 384, 1]
    num_workers: 0                       # shared memory too small for workers
    learning_rate: 0.0001

  resnet:
    model: resnet
    variant: "resnet18"
    pretrained: true
    freeze_backbone: false
    noise_coefficient: 0.0

  resnet50:
    model: resnet
    variant: "resnet50"
    pretrained: true
    freeze_backbone: false
    noise_coefficient: 0.0

  vit:
    model: vit
    patch_size: 4
    embed_dim: 128
    depth: 4
    nhead: 4
    dim_feedforward: 256
    dropout: 0.1
    scheduler: "cosine_warmup"
    noise_coefficient: 0.0

  vit_larger:
    model: vit
    patch_size: 4
    embed_dim: 256
    depth: 6
    nhead: 8
    dim_feedforward: 512
    dropout: 0.1
    scheduler: "cosine_warmup"
    noise_coefficient: 0.0

  vision_mamba_small_224:
    model: vision_mamba
    pretrained_path: "models/vision_mamba/vim_s_midclstok_80p5acc.pth"
    patch_size: 16                       # 14x14 patches, matches the pretrained grid
    embed_dim: 384                       # Vim-Small
    depth: 24
    ssm_d_state: 16
    ssm_d_conv: 4
    ssm_ratio: 2.0
    drop_path_rate: 0.1
    use_cls_token: true
    freeze_backbone: false
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001

  vision_mamba_mean_2xsigma:
    model: vision_mamba
    pretrained_path: "models/vision_mamba/vim_s_midclstok_80p5acc.pth"
    patch_size: 16
    embed_dim: 384
    depth: 24
    ssm_d_state: 16
    ssm_d_conv: 4
    ssm_ratio: 2.0
    drop_path_rate: 0.1
    use_cls_token: true
    freeze_backbone: false
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0

  mamba_vision_t_64:
    model: mamba_vision
    variant: "mamba_vision_T"
    pretrained: true
    spatial_image_mode: "gaussian"
    image_shape: [64, 64, 1]

  mamba_vision_t_128:
    model: mamba_vision
    variant: "mamba_vision_T"
    pretrained: true
    spatial_image_mode: "gaussian"
    image_shape: [128, 128, 1]

  swin_t:
    model: swin
    variant: "swin_tiny_patch4_window7_224"
    pretrained: true
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001

  # Swin-T ablation: fill_mode, sigma, LR

  swin_t_mean_fill:
    model: swin
    variant: "swin_tiny_patch4_window7_224"
    pretrained: true
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"                        # background = per-sample mean

  swin_t_mean_fill_2x_sigma:
    model: swin
    variant: "swin_tiny_patch4_window7_224"
    pretrained: true
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0

  swin_t_no_warmup:
    model: swin
    variant: "swin_tiny_patch4_window7_224"
    pretrained: true
    freeze_backbone: false
    scheduler: "reduce_on_plateau"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"

  swin_t_scratch:
    model: swin
    variant: "swin_tiny_patch4_window7_224"
    pretrained: false
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.001
    fill_mode: "mean"

  swin_t_mean_fill_lr5e5:
    model: swin
    variant: "swin_tiny_patch4_window7_224"
    pretrained: true
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.00005
    fill_mode: "mean"

  swin_t_bilinear_mean:
    model: swin
    variant: "swin_tiny_patch4_window7_224"
    pretrained: true
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "bilinear"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"

  swin_t_stage2:
    model: swin
    variant: "swin_tiny_patch4_window7_224"
    pretrained: true
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0
    out_stage: 2                              # 14x14x384 feature map
    head_type: "flatten"                      # flatten | dwconv | squeeze | mlp

  spatial_mamba_t_pretrained:
    model: spatial_mamba
    variant: "tiny"
    pretrained_path: "models/spatial_mamba/spatial_mamba_t.pth"
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0
    out_stage: 2                              # 14x14x384 feature map

  # 3 channels: RSSI, AP positions, detection mask

  swin_t_3ch:
    model: swin
    variant: "swin_tiny_patch4_window7_224"
    pretrained: true
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 3]
    learning_rate: 0.0001
    fill_mode: "mean"

  vision_mamba_3ch:
    model: vision_mamba
    pretrained_path: "models/vision_mamba/vim_s_midclstok_80p5acc.pth"
    patch_size: 16
    embed_dim: 384
    depth: 24
    ssm_d_state: 16
    ssm_d_conv: 4
    ssm_ratio: 2.0
    drop_path_rate: 0.1
    use_cls_token: true
    freeze_backbone: false
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 3]
    learning_rate: 0.0001
    fill_mode: "mean"

  mamba:
    model: mamba
    patch_size: 4
    embed_dim: 96
    depth: 6
    d_state: 1
    mlp_ratio: 4.0
    drop_path_rate: 0.1
    noise_coefficient: 0.0

  transformer:
    model: transformer
    d_model: 64
    nhead: 4
    num_encoder_layers: 2
    dim_feedforward: 256
    dropout: 0.1
    activation: "relu"
    scheduler: "cosine_warmup"
    use_positional_encoding: false
    masking_strategy: "additive"
    pooling: "cls"

  transformer_v2:
    model: transformer
    d_model: 128
    nhead: 8
    num_encoder_layers: 4
    dim_feedforward: 512
    dropout: 0.1
    activation: "relu"
    scheduler: "cosine_warmup"
    masking_strategy: "additive"
    pooling: "cls"
    variable_length: true
    spatial_positional_encoding: false
    learning_rate: 0.001

  transformer_v2_spatial:
    model: transformer
    d_model: 128
    nhead: 8
    num_encoder_layers: 4
    dim_feedforward: 512
    dropout: 0.1
    activation: "relu"
    scheduler: "cosine_warmup"
    masking_strategy: "additive"
    pooling: "cls"
    variable_length: true
    spatial_positional_encoding: true
    learning_rate: 0.001

  transformer_plateau:
    model: transformer
    d_model: 64
    nhead: 4
    num_encoder_layers: 2
    dim_feedforward: 256
    dropout: 0.1
    activation: "relu"
    scheduler: "reduce_on_plateau"
    use_positional_encoding: false
    masking_strategy: "additive"
    pooling: "cls"

  transformer_v2_plateau:
    model: transformer
    d_model: 128
    nhead: 8
    num_encoder_layers: 4
    dim_feedforward: 512
    dropout: 0.1
    activation: "relu"
    scheduler: "reduce_on_plateau"
    masking_strategy: "additive"
    pooling: "cls"
    variable_length: true
    spatial_positional_encoding: false
    learning_rate: 0.0001

  transformer_v2_spatial_plateau:
    model: transformer
    d_model: 128
    nhead: 8
    num_encoder_layers: 4
    dim_feedforward: 512
    dropout: 0.1
    activation: "relu"
    scheduler: "reduce_on_plateau"
    masking_strategy: "additive"
    pooling: "cls"
    variable_length: true
    spatial_positional_encoding: true
    learning_rate: 0.0001

  ffn:
    model: ffn
    hidden_layers: [256, 128]
    dropout: 0.25
    activation: "relu"
    noise_coefficient: 0.0

  ffn_large:
    model: ffn
    hidden_layers: [512, 256, 128]
    dropout: 0.25
    activation: "relu"
    noise_coefficient: 0.0

  sae:
    model: sae
    encoder_layers: [256, 128, 64]
    regression_layers: [256]
    dropout: 0.25
    corruption_level: 0.1               # masking probability
    pretrain_epochs: 50
    pretrain_batch_size: 64
    pretrain_lr: 0.001
    freeze_encoder: false
    noise_coefficient: 0.0
    learning_rate: 0.0001                # 1e-3 saturates the Sigmoid encoder
    scheduler: "reduce_on_plateau"

  sae_relu:
    model: sae
    encoder_layers: [256, 128, 64]
    regression_layers: [256]
    dropout: 0.25
    corruption_level: 0.1
    pretrain_epochs: 50
    pretrain_batch_size: 64
    pretrain_lr: 0.001
    freeze_encoder: false
    noise_coefficient: 0.0
    encoder_activation: "relu"
    learning_rate: 0.001
    scheduler: "reduce_on_plateau"

  gcn:
    model: gcn
    in_channels: 3                       # [rssi, norm_lat, norm_lon]
    use_ap_positions: true
    hidden_channels: 128
    num_layers: 3
    dropout: 0.3
    pooling: "concat"
    rssi_threshold: -95.0
    noise_coefficient: 0.0
    graph_topology: "covisible"

  gcn_bipartite:
    model: gcn
    in_channels: 3
    use_ap_positions: true
    hidden_channels: 128
    num_layers: 3
    dropout: 0.3
    pooling: "concat"
    rssi_threshold: -95.0
    noise_coefficient: 0.0
    graph_topology: "bipartite"

  gcn_larger:
    model: gcn
    in_channels: 3
    use_ap_positions: true
    hidden_channels: 256
    num_layers: 4
    dropout: 0.3
    pooling: "concat"
    rssi_threshold: -95.0
    noise_coefficient: 0.0
    graph_topology: "covisible"

  vgae:
    model: vgae
    in_channels: 3
    use_ap_positions: true
    hidden_channels: 128
    latent_dim: 64
    dropout: 0.3
    pooling: "concat"
    kl_weight: 0.1                       # weight of the KL term
    rssi_threshold: -95.0
    noise_coefficient: 0.0
    graph_topology: "covisible"

  vgae_bipartite:
    model: vgae
    in_channels: 3
    use_ap_positions: true
    hidden_channels: 128
    latent_dim: 64
    dropout: 0.3
    pooling: "concat"
    kl_weight: 0.1
    rssi_threshold: -95.0
    noise_coefficient: 0.0
    graph_topology: "bipartite"

  # Min-max normalization set (gaussian splat, mean fill, 2x sigma, 224px)

  dscnn_minmax:
    model: dscnn
    dropout: 0.5
    noise_coefficient: 0.0
    spatial_image_mode: "gaussian"
    image_shape: [64, 64, 1]

  # EfficientNet-B0 @224 (7x7x320 feature map)
  efficientnet_minmax_dwconv:
    model: efficientnet
    variant: "b0"
    pretrained: true
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0
    head_type: "dwconv"

  efficientnet_minmax_squeeze:
    model: efficientnet
    variant: "b0"
    pretrained: true
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0
    head_type: "squeeze"
    squeeze_channels: 3

  # Swin-T stage2 @224 (14x14x384 feature map)
  swin_minmax_dwconv:
    model: swin
    variant: "swin_tiny_patch4_window7_224"
    pretrained: true
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0
    out_stage: 2
    head_type: "dwconv"

  swin_minmax_squeeze:
    model: swin
    variant: "swin_tiny_patch4_window7_224"
    pretrained: true
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0
    out_stage: 2
    head_type: "squeeze"
    squeeze_channels: 3

  # ResNet18 @224 (7x7x512 feature map)
  resnet_minmax_dwconv:
    model: resnet
    variant: "resnet18"
    pretrained: true
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0
    head_type: "dwconv"

  resnet_minmax_squeeze:
    model: resnet
    variant: "resnet18"
    pretrained: true
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0
    head_type: "squeeze"
    squeeze_channels: 3

  # head ablation on the stage2 map
  swin_t_stage2_dwconv:
    model: swin
    variant: "swin_tiny_patch4_window7_224"
    pretrained: true
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0
    out_stage: 2
    head_type: "dwconv"                       # depthwise 14x14 conv -> Linear(384,2)

  swin_t_stage2_squeeze:
    model: swin
    variant: "swin_tiny_patch4_window7_224"
    pretrained: true
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0
    out_stage: 2
    head_type: "squeeze"                      # 1x1 conv 384->3 -> Linear(588,2)
    squeeze_channels: 3
  # 200k samples, max_epochs 200

  dscnn_minmax_200k:
    model: dscnn
    dropout: 0.5
    noise_coefficient: 0.0
    spatial_image_mode: "gaussian"
    image_shape: [64, 64, 1]
    max_samples: 200000
    max_epochs: 200

  efficientnet_minmax_dwconv_200k:
    model: efficientnet
    variant: "b0"
    pretrained: true
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0
    head_type: "dwconv"
    max_samples: 200000
    max_epochs: 200

  swin_minmax_squeeze_200k:
    model: swin
    variant: "swin_tiny_patch4_window7_224"
    pretrained: true
    freeze_backbone: false
    scheduler: "cosine_warmup"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0
    out_stage: 2
    head_type: "squeeze"
    squeeze_channels: 3
    max_samples: 200000
    max_epochs: 200

  # Pretrained-backbone recipe sweep (40k)

  # EfficientNet-B0 dwconv
  en_dwconv_constant:
    model: efficientnet
    variant: "b0"
    pretrained: true
    freeze_backbone: false
    scheduler: "constant"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0
    head_type: "dwconv"

  en_dwconv_rop:
    model: efficientnet
    variant: "b0"
    pretrained: true
    freeze_backbone: false
    scheduler: "reduce_on_plateau"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0
    head_type: "dwconv"

  en_dwconv_constant_lr3e4:
    model: efficientnet
    variant: "b0"
    pretrained: true
    freeze_backbone: false
    scheduler: "constant"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0003
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0
    head_type: "dwconv"

  en_dwconv_disclr:
    model: efficientnet
    variant: "b0"
    pretrained: true
    freeze_backbone: false
    scheduler: "constant"
    optimizer: "adamw"
    backbone_lr_mult: 0.1                 # backbone 1e-5, head 1e-4
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0
    head_type: "dwconv"

  # Swin-T squeeze (stage2 14x14)
  sw_sq_constant:
    model: swin
    variant: "swin_tiny_patch4_window7_224"
    pretrained: true
    freeze_backbone: false
    scheduler: "constant"
    spatial_image_mode: "gaussian"
    image_shape: [224, 224, 1]
    learning_rate: 0.0001
    fill_mode: "mean"
    gaussian_sigma_multiplier: 2.0
    out_stage: 2
    head_type: "squeeze"
    squeeze_channels: 3

  sw_sq_rop:
    model: swin
    variant: "swin_tiny_patch4_window7_224"
    pretrained: true
    freeze_backbone: false
    scheduler: "reduce_on_plateau"
    spatial_image_mode: "gaussian"
